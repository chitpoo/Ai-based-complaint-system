# Grievance Management backend — committed defaults (plan.md §8).
# Every value comes from an env var. Non-secret values have local defaults; secrets have none.
# Real secrets live in application-local.properties (gitignored) or platform env vars.

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${PORT:8080}

# --- Datasource (MySQL 8) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Grievance_System?characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- JWT (Step 4 reads these; no default: set JWT_SECRET, or app.jwt.secret in application-local.properties) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- ML service (base URL only; the client appends /predict and /health) ---
app.ml.url=${ML_URL:http://localhost:8000}

# --- Mail (false = log emails to console; SMTP settings used only when true) ---
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@example.com}

# --- CORS ---
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# --- Seed admin (DataSeeder, Step 2; password has no default: set ADMIN_PASSWORD or the local file) ---
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD}
